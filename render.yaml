services:
  - type: web
    name: asistente-ferias-raa
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: API_IA_CLAVE
        sync: false
      # Cookies de sesión solo por HTTPS (Render sirve por HTTPS)
      - key: RAA_COOKIE_SEGURA
        value: "1"
      # Primera cuenta administradora. El valor de la clave se carga a mano
      # en el panel de Render (sync: false) y solo se usa cuando la base
      # todavía no tiene cuentas. Nunca sobrescribe una cuenta existente.
      - key: RAA_ADMIN_CORREO
        sync: false
      - key: RAA_ADMIN_CLAVE
        sync: false
      - key: RAA_ADMIN_NOMBRE
        value: "Administración RAA"
      # En el plan free el disco es efímero: las cuentas se pierden al
      # redeployar. Para conservarlas, montá un disco persistente y apuntá
      # RAA_DB_PATH al archivo dentro de ese disco (por ejemplo
      # /var/data/raa.db). También podés cambiar la fuente del Excel con
      # RAA_EXCEL_PATH.
      - key: RAA_DB_PATH
        sync: false
